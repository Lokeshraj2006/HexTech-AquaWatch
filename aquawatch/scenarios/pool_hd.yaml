# Scenario preset: AQUATIC DISTRESS, HD detector (YOLO11s at 960 px, every frame, strict ByteTrack).
# The same rules as scenarios/pool.yaml; only stage 1 (detection + tracking) is heavier and more accurate on
# small, far-away swimmers in crowded pools. Needs yolo11s.pt in the project folder. Slower: use a GPU.

scenario:
  name: pool_hd
  title: "Aquatic distress (swimming pool, YOLO11s HD)"
  entity_word: Swimmer
  unit_word: body-heights
  behavior_names:
    aquatic_warning: "Swimmer may need help"
    aquatic_distress: "High-risk aquatic distress"
    submersion: "Possible submersion"

model:
  classes: [0]                 # stock YOLO: person
  # bigger stock model (tuned on crowded pool footage): sees small swimmers better. Exported to OpenVINO FP32 (quantize.py):
  # identical boxes (F1 1.000 on 100 frames), 1.34x faster here (729 vs 975 ms per frame at 960 px); INT8 rejected
  # (F1 0.92). Original: yolo11s.pt
  weights: models/quant/yolo11s_openvino_fp32/yolo11s_openvino_model
  imgsz: 960                   # detect at 960 px: far-away swimmers in a crowded pool
  conf: 0.40                   # fewer weak boxes (splashes, reflections)
  tracker: bytetrack_strict.yaml

video:
  frame_stride: 1              # every frame: smoother tracks in low-quality CCTV (slower)

pool:
  enabled: true
  # state_classes: {0: swimmer_horizontal, 1: swimmer_vertical, 2: head_only, 3: underwater, 4: out_of_water}

behaviors:                     # land rules make no sense in water: off
  loitering: {enabled: false}
  zone_intrusion: {enabled: false}
  running: {enabled: false}
  fall: {enabled: false}
  crowding: {enabled: false}
  near_miss: {enabled: false}
  approaching: {enabled: false}
  baseline: {enabled: false}
  aquatic_warning: {enabled: true}     # early warning: "please check swimmer N, they may need help"
  aquatic_distress: {enabled: true}
  submersion: {enabled: true}

stitch:
  enabled: true                # one swimmer = one ID, even after going under or a camera swing (stitch.py)

chains:
  enabled: true                # distress -> submersion is linked into one incident
  max_gap_s: 30.0

announce:
  min_risk: 0.7
